<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAON YouTube</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { width: 100%; height: 100%; border: 0; }
  /* 키오스크: 영상 탭이 재생/일시정지를 토글하지 못하게 한다. 전체화면은 Compose 가 처리한다. */
  #player, #player iframe { pointer-events: none; }
</style>
</head>
<body>
<div id="player"></div>
<script>
/*
 * DAON 유튜브 라이브 화면.
 *
 * Android 쪽에서 `?v=<영상 ID>` 로 넘긴다. 유튜브 공식 IFrame Player API 만 쓴다
 * (약관상 유튜브 콘텐츠는 공식 플레이어로만 재생해야 한다).
 *
 * 상태는 `DaonYT` 브리지로 넘긴다.
 *   onState("1")  재생 시작
 *   onError("..") 재생 실패(오프라인·임베드 차단·오류 코드)
 */
var VIDEO_ID = new URLSearchParams(location.search).get("v") || "__VIDEO_ID__";
var player = null;
var reported = false;

function post(name, value) {
  try {
    if (window.DaonYT && window.DaonYT[name]) window.DaonYT[name](String(value));
  } catch (e) { /* 브리지가 없으면 무시한다. */ }
}

function reportError(reason) {
  if (reported) return;
  reported = true;
  post("onError", reason);
}

function reportPlaying() {
  if (reported) return;
  reported = true;
  post("onState", "1");
}

/* 유튜브는 화질을 강제하지 않고 '제안'만 받는다. 여러 화질이 있으면 240p 를 쓴다. */
function preferLowQuality(target) {
  try { target.setPlaybackQuality("small"); } catch (e) { /* 무시 */ }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    videoId: VIDEO_ID,
    host: "https://www.youtube.com",
    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      vq: "small",
      rel: 0,
      playsinline: 1,
      modestbranding: 1,
      fs: 0,
      origin: location.origin
    },
    events: {
      onReady: function (event) {
        preferLowQuality(event.target);
        try { event.target.playVideo(); } catch (e) { /* onError 가 알려 준다. */ }
      },
      onStateChange: function (event) {
        if (event.data === YT.PlayerState.PLAYING) {
          preferLowQuality(event.target);
          reportPlaying();
        }
        if (event.data === YT.PlayerState.ENDED) reportError("ended");
      },
      onError: function (event) {
        reportError("code=" + event.data);
      }
    }
  });
}

/* API 스크립트가 막히면 임베드 iframe 으로 한 번 더 시도한다. */
function fallbackEmbed() {
  if (player) return;
  var frame = document.createElement("iframe");
  frame.src = "https://www.youtube.com/embed/" + VIDEO_ID +
    "?autoplay=1&controls=0&playsinline=1&rel=0&modestbranding=1&fs=0&vq=small";
  frame.setAttribute("allow", "autoplay; encrypted-media");
  frame.setAttribute("allowfullscreen", "true");
  var host = document.getElementById("player");
  host.innerHTML = "";
  host.appendChild(frame);
  reportPlaying();
}

setTimeout(fallbackEmbed, 9000);

/* 라이브가 꺼져 있거나 임베드가 막히면 상태가 오지 않는다. 25초 뒤 한 번 알린다. */
setTimeout(function () {
  if (!reported) reportError("timeout");
}, 25000);

var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
tag.onerror = fallbackEmbed;
document.head.appendChild(tag);
</script>
</body>
</html>
