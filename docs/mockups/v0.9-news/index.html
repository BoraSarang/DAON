<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DAON v0.9 — 오늘의 뉴스 티커 목업</title>
<!--
  목업 전용 파일. 실제 앱은 Compose 로 같은 배치를 그린다.
  - 기준: 1920×1200 (Fire HD 10), 1dp = 1.5px
  - ?shot=home|light|list|article|settings|spec 으로 한 장면만 1920×1200 렌더
  - 목업의 뉴스 제목·본문은 2026-11-01 연합뉴스·SBS RSS 실제 값(읽기용 예시)
-->
<style>
  :root{
    --bg:#0B0D10; --surface:#12151A; --surface2:#171B21; --surface3:#1E242D;
    --text:#F2F4F7; --text2:#A7AFBB; --muted:#6E7683;
    --rule:#232932; --accent:#E8B45A; --accentSoft:rgba(232,180,90,.15);
    --danger:#E2695C; --sunday:#F07A6A; --saturday:#82B4FF;
    --ok:#57C99B; --term:#9ADB8A; --rain:#7FB0FF;
    --onAccent:#0B0D10; --scrim:rgba(0,0,0,.60);
  }
  .light{
    --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#EAE5DB; --surface3:#E1DBCE;
    --text:#1A1D21; --text2:#4B525C; --muted:#5E656F;
    --rule:#D9D2C6; --accent:#7A500F; --accentSoft:rgba(122,80,15,.12);
    --danger:#B3352A; --sunday:#B3352A; --saturday:#1F5FA8;
    --ok:#1F7A4E; --term:#2C6B1E; --rain:#1F5FA8;
    --onAccent:#FFFFFF; --scrim:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#05070A;color:var(--text);
       font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}

  /* ---------- 시트 ---------- */
  .sheet{display:flex;flex-direction:column;gap:34px;padding:40px;align-items:center}
  .sheet-head{width:calc(1840px * var(--z,.86));margin-bottom:-6px}
  .sheet-head h1{font-size:30px;font-weight:800;letter-spacing:-.4px}
  .sheet-head p{margin-top:8px;font-size:16px;color:#8b93a0;line-height:1.6}
  .frame{width:calc(1920px * var(--z,.86))}
  .frame .screen{zoom:var(--z,.86)}
  .frame figcaption{display:flex;gap:14px;align-items:baseline;margin-top:14px;font-size:16px;color:#9aa3b0}
  .frame b{color:var(--accent);font-size:18px}
  .frame .cost{color:#6f7783}

  body.shot{padding:0;background:#000}
  body.shot .sheet{padding:0;gap:0}
  body.shot .sheet-head,body.shot figcaption{display:none}
  body.shot .frame{display:none;width:1920px}
  body.shot .frame.on{display:block}
  body.shot .frame .screen{zoom:1}

  /* ---------- 화면 ---------- */
  .screen{position:relative;width:1920px;height:1200px;padding:40px;display:flex;flex-direction:column;
          background:var(--bg);color:var(--text);overflow:hidden;isolation:isolate}
  .screen .bgscene{position:absolute;inset:0;z-index:0;pointer-events:none}
  .screen > *{position:relative;z-index:1}

  /* 상단 바 */
  .topbar{height:88px;flex:0 0 88px;display:flex;align-items:center;gap:24px;margin-bottom:24px}
  .head-l{flex:0 0 auto}
  .head-l .title{font-size:48px;font-weight:700;letter-spacing:-.022em;line-height:1.05;white-space:nowrap}
  .head-l .sub{font-size:27px;color:var(--text2);font-weight:500;margin-top:4px;white-space:nowrap}
  .accent{color:var(--accent)}
  .term{color:var(--term)}

  /* 뉴스 티커 */
  .ticker{flex:1;min-width:0;height:64px;display:flex;align-items:center;
          border:1px solid var(--rule);border-radius:15px;background:var(--surface);overflow:hidden}
  .ticker .tag{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px;
               font-size:23px;font-weight:800;letter-spacing:.02em;color:var(--accent)}
  .ticker .tag i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
  .ticker .tag::after{content:"";width:1px;height:32px;background:var(--rule)}
  .ticker .window{position:relative;flex:1;height:100%;overflow:hidden}
  .ticker .window::before,.ticker .window::after{content:"";position:absolute;top:0;bottom:0;z-index:2;pointer-events:none}
  .ticker .window::before{left:0;width:34px;background:linear-gradient(90deg,var(--surface),transparent)}
  .ticker .window::after{right:0;width:62px;background:linear-gradient(270deg,var(--surface),transparent)}
  .ticker .track{display:flex;height:100%;align-items:center;width:max-content;
       animation:marquee 52s linear infinite}
  .ticker .half{display:flex;align-items:center;gap:76px;padding-right:76px}
  .ticker .item{font-size:27px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;color:var(--text)}
  .ticker .item b{color:var(--accent);font-weight:800}
  .ticker.off .tag{color:var(--muted)}
  .ticker.off .tag i{background:var(--muted)}
  .ticker.off .item{color:var(--text2)}
  .ticker .stamp{flex:0 0 auto;padding:0 20px 0 4px;font-size:21px;font-weight:600;color:var(--muted);white-space:nowrap}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .right{flex:0 0 auto;display:flex;align-items:center;gap:14px}
  .dots{display:flex;gap:10px;align-items:center;margin-right:12px}
  .dots i{width:11px;height:11px;border-radius:999px;background:#3A424E;display:block}
  .dots i.on{background:var(--accent)}
  .btn{height:64px;padding:0 27px;display:flex;align-items:center;border-radius:15px;
       border:1px solid var(--rule);background:var(--surface);color:var(--text2);
       font-size:25px;font-weight:600;letter-spacing:-.01em}
  .btn.strong{color:var(--text)}

  /* 공통 패널 */
  .grid{flex:1;display:grid;grid-template-columns:70fr 30fr;gap:24px;min-height:0}
  .panel{background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden;
         display:flex;flex-direction:column;min-height:0}

  /* 달력 */
  .cal-head{height:92px;flex:0 0 92px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--rule)}
  .nav{width:64px;height:64px;border:1px solid var(--rule);border-radius:14px;background:var(--surface2);
       color:var(--text2);font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center}
  .cal-title{font-size:58px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-left:6px}
  .cal-title .year{font-size:34px;font-weight:600;color:var(--text2);margin-right:10px;vertical-align:7px}
  .today-btn{margin-left:auto;height:56px;padding:0 24px;border:1px solid rgba(232,180,90,.55);border-radius:13px;
       background:var(--accentSoft);color:var(--accent);font-size:24px;font-weight:700}
  .weekdays{height:50px;flex:0 0 50px;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--rule)}
  .weekdays span{display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:600;color:var(--text2)}
  .weekdays .sun{color:var(--sunday)} .weekdays .sat{color:var(--saturday)}
  .cells{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);
         gap:1px;background:var(--rule);min-height:0}
  .cell{background:var(--surface);padding:10px 12px 9px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .cell .r1{display:flex;align-items:baseline;gap:10px}
  .cell .num{font-size:47px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .cell .lunar{margin-left:auto;font-size:24px;line-height:1.1;font-weight:500;color:#A7B0BD;white-space:nowrap}
  .light .cell .lunar{color:#6B6355}
  .cell .line{margin-top:auto;display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
  .cell .ev{font-size:21px;font-weight:500;color:var(--text2);overflow:hidden;text-overflow:ellipsis}
  .cell .tag2{font-size:21px;font-weight:700;color:var(--term);flex:0 0 auto}
  .cell .tag2.holiday{color:var(--danger)}
  .cell.sun .num{color:var(--sunday)} .cell.sat .num{color:var(--saturday)}
  .cell.out{opacity:.34}
  .cell.today{background:var(--accent)}
  .cell.today .num,.cell.today .ev,.cell.today .tag2{color:var(--onAccent)}
  .cell.today .lunar{color:var(--onAccent);opacity:.72}
  .farm{flex:0 0 98px;height:98px;display:flex;align-items:center;gap:18px;padding:0 26px;
        border-top:1px solid var(--rule);background:var(--accentSoft)}
  .farm .lbl{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .farm .txt{font-size:27px;font-weight:600;line-height:1.15;margin-top:3px;color:var(--text)}
  .farm svg{width:46px;height:46px;flex:0 0 46px;color:var(--accent)}

  /* 오른쪽 카드 */
  .side{display:grid;grid-template-rows:320px 1fr;gap:24px;min-height:0}
  .clock{padding:30px 32px;display:flex;flex-direction:column;justify-content:center}
  .k{font-size:24px;font-weight:700;color:var(--muted);letter-spacing:.06em}
  .clock-time{font-size:112px;font-weight:700;letter-spacing:-.04em;line-height:.94;margin-top:10px}
  .clock-time .ampm{font-size:38px;font-weight:600;letter-spacing:0;margin-right:12px;color:var(--text2);vertical-align:22px}
  .clock-sec{font-size:30px;color:var(--muted);font-weight:600;margin-top:8px}
  .clock-day{font-size:31px;color:var(--text2);font-weight:600;margin-top:12px}
  .weather{padding:28px 32px;display:flex;flex-direction:column;min-height:0}
  .wc-top{display:flex;align-items:center;gap:18px;margin-top:6px}
  .wc-temp{font-size:126px;font-weight:700;line-height:.86;letter-spacing:-.05em}
  .wc-cond{font-size:38px;font-weight:600;color:var(--text2);line-height:1.15}
  .wc-cond .hi{display:block;font-size:27px;color:var(--muted);font-weight:500;margin-top:6px}
  .wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:22px}
  .wc-item .kk{font-size:21px;color:var(--muted);font-weight:600}
  .wc-item .vv{font-size:32px;font-weight:700;margin-top:2px}
  .wc-div{height:1px;background:var(--rule);margin:20px 0 14px}
  .mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mini3 .m3{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:12px;background:var(--surface2)}
  .mini3 .d{font-size:21px;color:var(--text2);font-weight:700}
  .mini3 .t{font-size:25px;font-weight:700}
  .wc-note{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;
      background:rgba(232,180,90,.10);border:1px solid rgba(232,180,90,.30)}
  .wc-note .nt{font-size:21px;font-weight:700;color:var(--accent)}
  .wc-note .ns{font-size:20px;color:var(--text2);font-weight:500;margin-top:2px}

  /* ---------- 겹침 패널 공통 ---------- */
  .scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
  .side-panel{position:absolute;top:0;right:0;bottom:0;z-index:6;background:var(--surface);
       border-left:1px solid var(--rule);border-radius:27px 0 0 27px;display:flex;flex-direction:column}
  .side-panel .phead{display:flex;align-items:center;gap:14px;padding:34px 40px 18px}
  .side-panel .phead h2{font-size:44px;font-weight:700;letter-spacing:-.02em}
  .side-panel .phead .close{margin-left:auto;width:60px;height:60px;border:1px solid var(--rule);border-radius:15px;
       background:var(--surface2);color:var(--text2);font-size:30px;display:flex;align-items:center;justify-content:center}
  .side-panel .phead .close.back{margin-left:0;width:auto;padding:0 26px;gap:10px;font-size:26px;font-weight:600}
  .pmeta{display:flex;align-items:center;gap:12px;padding:0 40px;font-size:22px;color:var(--muted);font-weight:600}
  .pmeta .src{color:var(--accent);font-weight:700}

  /* 뉴스 목록 */
  .news-list{width:900px}
  .news-list .rows{flex:1;min-height:0;overflow:hidden;padding:14px 24px 0;display:flex;flex-direction:column;position:relative}
  .news-list .rows::after{content:"";position:absolute;left:0;right:0;bottom:0;height:54px;pointer-events:none;
       background:linear-gradient(180deg,transparent,var(--surface))}
  .news-row{display:flex;align-items:center;gap:16px;padding:18px 16px;border-top:1px solid var(--rule)}
  .news-row:first-child{border-top:0}
  .news-row .time{flex:0 0 78px;font-size:23px;font-weight:700;color:var(--muted)}
  .news-row .txt{flex:1;min-width:0;font-size:27px;font-weight:600;line-height:1.22;color:var(--text);
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-row .src-chip{flex:0 0 auto;height:34px;padding:0 11px;display:flex;align-items:center;
       border:1px solid var(--rule);border-radius:9px;background:var(--surface2);
       font-size:17px;font-weight:700;color:var(--text2);letter-spacing:-.01em}
  .news-row .src-chip.sbs{color:var(--accent);border-color:rgba(232,180,90,.42);background:var(--accentSoft)}
  .news-row .chev{flex:0 0 auto;color:var(--muted);font-size:30px}
  .news-row.new .txt{color:var(--text)}
  .news-row.new .time{color:var(--accent)}
  .list-foot{flex:0 0 auto;padding:18px 40px 30px;font-size:21px;color:var(--muted);border-top:1px solid var(--rule)}

  /* 기사 */
  .article{width:900px}
  .article .scroll{flex:1;min-height:0;overflow:hidden;padding:6px 40px 0;position:relative}
  .article .scroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
       background:linear-gradient(180deg,transparent,var(--surface))}
  .article h1{font-size:52px;line-height:1.22;font-weight:700;letter-spacing:-.025em;margin:10px 0 26px}
  .article .body{font-size:27px;line-height:1.66;font-weight:400;color:var(--text2);letter-spacing:-.01em}
  .article .body p{margin-bottom:22px}
  .article .body p.lead{color:var(--text);font-weight:500}
  .article .foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
       padding:22px 40px 30px;border-top:1px solid var(--rule)}
  .article .foot .navb{height:64px;padding:0 26px;border:1px solid var(--rule);border-radius:14px;background:var(--surface2);
       color:var(--text2);font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px;justify-self:start}
  .article .foot .navb.next{justify-self:end}
  .article .foot .idx{font-size:23px;font-weight:700;color:var(--muted)}

  /* 설정 */
  .settings{width:1020px;padding:0 48px 0}
  .settings .phead{padding:38px 0 10px}
  .settings .scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:26px;padding-top:14px}
  .sec{border:1px solid var(--rule);border-radius:20px;background:var(--surface2);padding:26px 28px}
  .sec.hi{border-color:rgba(232,180,90,.45);background:linear-gradient(180deg,rgba(232,180,90,.08),transparent 70%),var(--surface2)}
  .sec h3{font-size:26px;font-weight:700;color:var(--text2);letter-spacing:.02em;margin-bottom:18px}
  .sec.hi h3{color:var(--accent)}
  .row{display:flex;align-items:center;gap:18px}
  .row + .row{margin-top:18px}
  .row .lab{font-size:23px;font-weight:600;color:var(--text)}
  .row .desc{font-size:19px;color:var(--muted);margin-top:4px}
  .toggle{width:74px;height:42px;border-radius:999px;background:var(--accent);position:relative;flex:0 0 auto;margin-left:auto}
  .toggle::after{content:"";position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;background:var(--onAccent)}
  .chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .chip{height:56px;padding:0 22px;display:flex;align-items:center;border-radius:12px;
        border:1px solid var(--rule);background:var(--surface);color:var(--text2);font-size:22px;font-weight:700}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
  .note{margin-top:16px;font-size:19px;line-height:1.5;color:var(--muted)}
  .subhead{font-size:22px;font-weight:700;color:var(--text2);margin-top:22px}
  .mini-btn{height:56px;padding:0 22px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);
        color:var(--text);font-size:22px;font-weight:600;display:flex;align-items:center}
  .stamp2{font-size:19px;color:var(--muted);margin-left:12px}

  /* ---------- 스펙 보드 ---------- */
  .spec{background:#0E1116}
  .spec .inner{padding:34px 44px;height:100%;display:flex;flex-direction:column;gap:15px}
  .spec h1{font-size:35px;font-weight:800;letter-spacing:-.5px}
  .spec .lead{font-size:18px;color:var(--text2);line-height:1.55;margin-top:-6px}
  .cols{display:grid;grid-template-columns:1.06fr .94fr;gap:16px}
  .box{border:1px solid var(--rule);border-radius:16px;background:var(--surface);padding:18px 22px;min-width:0}
  .box h4{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:.05em;margin-bottom:12px}
  .demo{margin:2px 0 14px;overflow:hidden;border-radius:12px}
  .demo .ticker{height:58px;border-radius:12px}
  .demo .ticker .track{animation:none}
  .demo .ticker .item{font-size:23px}
  .demo .ticker .tag{font-size:20px;padding:0 14px 0 16px;gap:10px}
  .callouts{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;font-size:16px;line-height:1.45;color:var(--text2)}
  .callouts b{color:var(--text);font-weight:700}
  .strip{height:54px;display:flex;align-items:center;border:1px solid var(--rule);border-radius:11px;
         background:var(--surface);overflow:hidden;margin-top:9px}
  .strip .tag{padding:0 14px;font-size:18px;font-weight:800;color:var(--accent);flex:0 0 auto}
  .strip .txt{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;color:var(--text);min-width:0}
  .strip.off .tag{color:var(--muted)} .strip.off .txt{color:var(--text2)}
  .strip .st{margin-left:auto;padding:0 14px;font-size:16px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
  .tiny{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
  .step{flex:1;min-width:0;padding:11px 13px;border-radius:11px;border:1px solid var(--rule);background:var(--surface2);color:var(--text);font-size:16px;line-height:1.35}
  .step b{display:block;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.06em;margin-bottom:4px}
  .step span{display:block;font-size:14px;color:var(--muted);margin-top:3px}
  .arrow{color:var(--muted);font-size:20px;flex:0 0 auto}
  .retain{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
  .retain div{font-size:15px;line-height:1.4;color:var(--text2);padding-right:12px}
  .retain div + div{border-left:1px solid var(--rule);padding-left:12px}
  .retain b{display:block;font-size:13.5px;font-weight:800;color:var(--accent);letter-spacing:.05em;margin-bottom:3px}
  .bottom{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  table.src{border-collapse:collapse;width:100%;font-size:15.5px}
  table.src th{text-align:left;color:var(--muted);font-weight:700;font-size:13.5px;letter-spacing:.05em;padding:0 10px 7px 0}
  table.src td{padding:7px 10px 7px 0;border-top:1px solid var(--rule);color:var(--text2);vertical-align:top}
  table.src td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
  .yes{color:var(--ok);font-weight:800}
  .no{color:var(--danger);font-weight:800}
  .notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;font-size:15.5px;line-height:1.5;color:var(--text2)}
  .notes b{color:var(--text)}
  .notes .n{border-left:3px solid var(--accent);padding-left:12px}
</style>
</head>
<body>

<div class="sheet">
  <header class="sheet-head">
    <h1>DAON v0.9 — 달력 상단 ‘오늘의 뉴스’ 티커</h1>
    <p>기준 1920×1200 · 1dp=1.5px · 실제 연합뉴스·SBS RSS(2026-11-01 17:53) 제목 사용 · 키오스크를 벗어나지 않고 목록·본문까지 본다</p>
  </header>

  <figure class="frame" data-shot="home"><div class="screen" id="f-home"></div>

const LUNAR = [
  "9/22","9/23","9/24","9/25","9/26","9/27","9/28","9/29","10/1","10/2","10/3","10/4","10/5","10/6",
  "10/7","10/8","10/9","10/10","10/11","10/12","10/13","10/14","10/15","10/16","10/17","10/18","10/19","10/20","10/21","10/22",
  "10/23","10/24","10/25","10/26","10/27","10/28","10/29","10/30","11/1","11/2","11/3","11/4"
];

function cells(){
  const out = [];
  for (let i = 0; i < 42; i++) {
    const dayIndex = i + 1;              // 11/1 = 1
    const isDec = dayIndex > 30;
    const d = isDec ? dayIndex - 30 : dayIndex;
    const ev = (isDec && d === 2) ? "생일 이사랑" : "";
    const term = (!isDec && d === 7) ? "입동" : (!isDec && d === 22) ? "소설" : (isDec && d === 7) ? "대설" : "";
    out.push({d, isDec, lunar:`음 ${LUNAR[i]}`, ev, term, today: !isDec && d === 1});
  }
  return out;
}

function cellHtml(c, i){
  const col = i % 7;
  const cls = ["cell", col===0?"sun":"", col===6?"sat":"", c.isDec?"out":"", c.today?"today":""].filter(Boolean).join(" ");
  const tags = [];
  if (c.ev) tags.push(`<span class="ev">${c.ev}</span>`);
  if (c.term) tags.push(`<span class="tag2">${c.term}</span>`);
  return `<div class="${cls}">
    <div class="r1"><span class="num">${c.d}</span><span class="lunar">${c.lunar}</span></div>
    ${tags.length ? `<div class="line">${tags.join("")}</div>` : ""}
  </div>`;
}

function tickerHtml(items, opt={}){
  const cls = "ticker" + (opt.off ? " off" : "");
  const half = `<div class="half">${items.map(n=>`<span class="item">${n}</span>`).join("")}</div>`;
  return `<div class="${cls}">
     <div class="tag"><i></i>뉴스</div>
     <div class="window"><div class="track">${opt.single ? half : half + half}</div></div>
     ${opt.stamp ? `<div class="stamp">${opt.stamp}</div>` : ""}
   </div>`;
}
